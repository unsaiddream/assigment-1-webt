<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 4</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
<div class="page">
    <div class="header"><h1>Task 4</h1></div>
    <div class="navigation" role="navigation" aria-label="Assignment tasks">
        <a href="../task1/index.html">Task 1</a>
        <a href="../index.html">Task 2</a>
        <a href="../task3/index.html">Task 3</a>
        <a href="../task4/index.html" aria-current="page">Task 4</a>
    </div>

    <h2 id="grades-title">Student grades</h2>
    <table>
        <caption>Sample grades</caption>
        <thead>
            <tr><th scope="col">Name</th><th scope="col">Subject</th><th scope="col">Grade</th></tr>
        </thead>
        <tbody>
            <tr><td>Sanzhar</td><td>Web</td><td>95</td></tr>
            <tr><td>Ali</td><td>Math</td><td>88</td></tr>
            <tr class="highlight-row"><td>Dana</td><td>English</td><td>100</td></tr>
            <tr><td>Aruzhan</td><td>Web</td><td>90</td></tr>
        </tbody>
        <tfoot>
            <tr><td colspan="2">Average</td><td>93.25</td></tr>
        </tfoot>
    </table>

    <form id="feedback-form" class="feedback-form">
        <h2>Feedback</h2>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="role">Role</label>
        <select id="role" name="role">
            <option>Student</option>
            <option>Teacher</option>
            <option>Other</option>
        </select>

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="4"></textarea>
        <button type="submit">Submit</button>
    </form>

    <div class="footer">&copy; 2026 Sanzhar Karaulov</div>
</div>
<script>
    document.getElementById('feedback-form').addEventListener('submit', function (event) {
        event.preventDefault();
        document.getElementById('form-status').textContent = 'Demo complete. Nothing was sent.';
    });
</script>
</body>
</html>
